<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago exitoso | Patagonia SimRacing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #e8ff00;
      margin-bottom: 0.75rem;
    }
    p { color: #aaa; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      background: #e8ff00;
      color: #0a0a0a;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      margin: 0.4rem;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-secondary {
      background: transparent;
      color: #e8ff00;
      border: 1px solid #e8ff00;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏁</div>
    <h1>¡Pago confirmado!</h1>
    <p>Tu reserva en Patagonia SimRacing está lista.<br>
    Te contactaremos por WhatsApp para confirmar el horario.</p>
    <a href="https://wa.me/56984630196?text=Hola%2C+acabo+de+pagar+online+y+quiero+confirmar+mi+reserva." class="btn">
      Confirmar por WhatsApp
    </a>
    <a href="https://www.patagoniasimracing.cl" class="btn btn-secondary">
      Volver al inicio
    </a>
  </div>
</body>
</html>
